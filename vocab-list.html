<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HSK Vocabulary List</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    /* ── Page layout ── */
    .vl-hero {
      text-align: center;
      padding: 36px 24px 20px;
    }
    .vl-hero h2 {
      font-size: 1.6rem;
      font-weight: 800;
      margin-bottom: 6px;
    }
    .vl-hero p {
      color: var(--muted);
      font-size: .95rem;
    }

    /* ── Tab switcher ── */
    .vl-tabs {
      display: flex;
      justify-content: center;
      gap: 10px;
      padding: 0 24px 20px;
    }
    .vl-tab {
      padding: 10px 28px;
      border: 2px solid var(--border);
      border-radius: 30px;
      background: var(--card);
      color: var(--text);
      font-size: .95rem;
      font-weight: 700;
      cursor: pointer;
      transition: all .18s;
    }
    .vl-tab.active,
    .vl-tab:hover {
      background: var(--red);
      border-color: var(--red);
      color: #fff;
    }
    .vl-tab.hsk2.active,
    .vl-tab.hsk2:hover {
      background: var(--blue);
      border-color: var(--blue);
      color: #fff;
    }

    /* ── Search & filter bar ── */
    .vl-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      max-width: 900px;
      margin: 0 auto 20px;
      padding: 0 20px;
    }
    .vl-search {
      flex: 1;
      min-width: 180px;
      padding: 9px 14px;
      border: 2px solid var(--border);
      border-radius: 8px;
      font-size: .95rem;
      background: var(--card);
      color: var(--text);
    }
    .vl-search:focus {
      outline: none;
      border-color: var(--red);
    }
    .vl-filter {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .vl-fbtn {
      padding: 6px 14px;
      border: 2px solid var(--border);
      border-radius: 20px;
      background: var(--card);
      color: var(--muted);
      font-size: .82rem;
      font-weight: 600;
      cursor: pointer;
      transition: all .15s;
    }
    .vl-fbtn.active,
    .vl-fbtn:hover {
      background: var(--red);
      border-color: var(--red);
      color: #fff;
    }

    /* ── Word count badge ── */
    .vl-count {
      text-align: center;
      color: var(--muted);
      font-size: .88rem;
      margin-bottom: 14px;
    }

    /* ── Word table ── */
    .vl-table-wrap {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 20px 60px;
    }
    .vl-table {
      width: 100%;
      border-collapse: collapse;
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .vl-table thead th {
      background: var(--red);
      color: #fff;
      padding: 11px 16px;
      text-align: left;
      font-size: .85rem;
      font-weight: 700;
      letter-spacing: .04em;
    }
    .vl-table tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background .12s;
    }
    .vl-table tbody tr:last-child { border-bottom: none; }
    .vl-table tbody tr:hover { background: #f9f7f4; }
    .vl-table td {
      padding: 11px 16px;
      font-size: .95rem;
      vertical-align: middle;
    }
    .vl-char {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: .04em;
      color: var(--text);
    }
    .vl-pinyin {
      color: var(--blue);
      font-size: .9rem;
    }
    .vl-english {
      color: var(--text);
    }
    .vl-type {
      display: inline-block;
      padding: 2px 9px;
      border-radius: 12px;
      font-size: .75rem;
      font-weight: 700;
      background: #eee;
      color: #555;
    }
    .vl-num { color: var(--muted); font-size: .82rem; }

    /* HSK2 accent for table header */
    .hsk2-mode .vl-table thead th { background: var(--blue); }
    .hsk2-mode .vl-search:focus { border-color: var(--blue); }
    .hsk2-mode .vl-fbtn.active,
    .hsk2-mode .vl-fbtn:hover { background: var(--blue); border-color: var(--blue); }

    .vl-empty {
      text-align: center;
      padding: 40px;
      color: var(--muted);
      font-size: 1rem;
    }

    /* ── Practice button ── */
    .vl-practice-bar {
      text-align: center;
      margin-bottom: 24px;
    }
    .vl-practice-btn {
      display: inline-block;
      padding: 10px 28px;
      border-radius: 8px;
      background: var(--green);
      color: #fff;
      font-weight: 700;
      font-size: .95rem;
      text-decoration: none;
      border: none;
      cursor: pointer;
    }
    .vl-practice-btn:hover { background: var(--green-dk); }

    @media (max-width: 600px) {
      .vl-table td:nth-child(1) { width: 36px; }
      .vl-char { font-size: 1.15rem; }
    }
  </style>
</head>
<body>

  <!-- ── HEADER ── -->
  <header>
    <div class="header-left">
      <button class="back-btn" onclick="window.location.href='index.html'">← Home</button>
      <span class="logo">汉字</span>
      <h1 id="page-heading">HSK Vocabulary List</h1>
      <span class="level-badge" id="level-badge">HSK 1</span>
    </div>
    <div class="header-right">
      <span id="header-count">150 words</span>
    </div>
  </header>

  <!-- ── HERO ── -->
  <div class="vl-hero">
    <h2>HSK Word Lists</h2>
    <p>Browse and search all 150 words for each level. Click <em>Practice</em> to start a quiz.</p>
  </div>

  <!-- ── TABS ── -->
  <div class="vl-tabs">
    <button class="vl-tab active"  id="tab-hsk1" onclick="switchLevel('HSK1')">HSK 1 (150 words)</button>
    <button class="vl-tab hsk2"   id="tab-hsk2" onclick="switchLevel('HSK2')">HSK 2 (150 words)</button>
  </div>

  <!-- ── PRACTICE BUTTON ── -->
  <div class="vl-practice-bar">
    <a id="practice-link" href="vocab.html?level=HSK1" class="vl-practice-btn">📖 Practice HSK 1 Vocabulary →</a>
  </div>

  <!-- ── CONTROLS ── -->
  <div class="vl-controls">
    <input
      class="vl-search"
      id="vl-search"
      type="search"
      placeholder="Search characters, pinyin, or English…"
      autocomplete="off"
      oninput="renderList()"
    />
    <div class="vl-filter" id="vl-filter">
      <button class="vl-fbtn active" data-type="All">All</button>
      <button class="vl-fbtn" data-type="noun">Nouns</button>
      <button class="vl-fbtn" data-type="verb">Verbs</button>
      <button class="vl-fbtn" data-type="adj">Adjectives</button>
      <button class="vl-fbtn" data-type="adv">Adverbs</button>
      <button class="vl-fbtn" data-type="pron">Pronouns</button>
      <button class="vl-fbtn" data-type="num">Numbers</button>
      <button class="vl-fbtn" data-type="mw">Measure Words</button>
      <button class="vl-fbtn" data-type="conj">Conjunctions</button>
      <button class="vl-fbtn" data-type="prep">Prepositions</button>
      <button class="vl-fbtn" data-type="particle">Particles</button>
      <button class="vl-fbtn" data-type="interj">Expressions</button>
    </div>
  </div>

  <!-- ── WORD COUNT ── -->
  <p class="vl-count" id="vl-count">Showing 150 of 150 words</p>

  <!-- ── TABLE ── -->
  <div class="vl-table-wrap">
    <table class="vl-table" id="vl-table">
      <thead>
        <tr>
          <th>#</th>
          <th>Character</th>
          <th>Pinyin</th>
          <th>English</th>
          <th>Type</th>
        </tr>
      </thead>
      <tbody id="vl-tbody"></tbody>
    </table>
  </div>

  <script src="hsk1-vocab.js"></script>
  <script src="hsk2-vocab.js"></script>
  <script>
    'use strict';

    let currentLevel  = 'HSK1';
    let currentType   = 'All';
    let currentSearch = '';

    function switchLevel(level) {
      currentLevel  = level;
      currentType   = 'All';
      currentSearch = '';
      document.getElementById('vl-search').value = '';
      document.querySelectorAll('.vl-fbtn').forEach(b => b.classList.toggle('active', b.dataset.type === 'All'));
      document.getElementById('tab-hsk1').classList.toggle('active', level === 'HSK1');
      document.getElementById('tab-hsk2').classList.toggle('active', level === 'HSK2');
      document.getElementById('level-badge').textContent = level === 'HSK2' ? 'HSK 2' : 'HSK 1';
      document.getElementById('practice-link').href = `vocab.html?level=${level}`;
      document.getElementById('practice-link').textContent = `📖 Practice ${level === 'HSK2' ? 'HSK 2' : 'HSK 1'} Vocabulary →`;
      document.body.classList.toggle('hsk2-mode', level === 'HSK2');
      renderList();
    }

    function renderList() {
      const words  = currentLevel === 'HSK2' ? HSK2_VOCAB : HSK1_VOCAB;
      const search = document.getElementById('vl-search').value.toLowerCase().trim();
      const type   = currentType;

      const filtered = words.filter((w, _i) => {
        if (type !== 'All' && w.type !== type) return false;
        if (search) {
          return (
            w.word.includes(search) ||
            w.pinyin.toLowerCase().includes(search) ||
            w.english.toLowerCase().includes(search)
          );
        }
        return true;
      });

      const tbody = document.getElementById('vl-tbody');
      if (filtered.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="vl-empty">No words found.</td></tr>';
      } else {
        tbody.innerHTML = filtered.map((w, i) => `
          <tr>
            <td class="vl-num">${i + 1}</td>
            <td class="vl-char">${w.word}</td>
            <td class="vl-pinyin">${w.pinyin}</td>
            <td class="vl-english">${w.english}</td>
            <td><span class="vl-type">${w.type}</span></td>
          </tr>
        `).join('');
      }

      const total = words.length;
      document.getElementById('vl-count').textContent =
        filtered.length === total
          ? `Showing all ${total} words`
          : `Showing ${filtered.length} of ${total} words`;
      document.getElementById('header-count').textContent = `${filtered.length} / ${total} words`;
    }

    // Filter buttons
    document.getElementById('vl-filter').addEventListener('click', e => {
      const btn = e.target.closest('.vl-fbtn');
      if (!btn) return;
      currentType = btn.dataset.type;
      document.querySelectorAll('.vl-fbtn').forEach(b => b.classList.toggle('active', b === btn));
      renderList();
    });

    // Initial render
    const initLevel = new URLSearchParams(window.location.search).get('level') || 'HSK1';
    switchLevel(initLevel);
  </script>
</body>
</html>
